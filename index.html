<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — Jana's Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    /* Megan-style cosmos palette */
    --cream: #f3f1eb;
    --ink: #242424;
    --ink-inverted: #fff;
    --ink-mute: #a2a2a2;
    --cosmos: #0a0d16;
    --cosmos-1: #1b1f30;
    --cosmos-2: #05060d;
    --green-1: #7db592;
    --frog-green: #7AB85F;

    /* Pixel-Nintendo typography */
    --font-display: "Press Start 2P", "Pixelify Sans", monospace;
    --font-mono:    "Pixelify Sans", "VT323", "Source Code Pro", monospace;
    --font-body:    "Pixelify Sans", "VT323", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: var(--font-mono);
    color: var(--ink-inverted);
    -webkit-font-smoothing: antialiased;
  }

  /* Cosmos — Megan-style deep dark with a warm halo behind the cart */
  body {
    background:
      radial-gradient(ellipse 60% 35% at 50% 78%, rgba(255, 200, 110, 0.14) 0%, rgba(255, 200, 110, 0) 65%),
      radial-gradient(ellipse at 50% 30%, var(--cosmos-1) 0%, var(--cosmos) 55%, var(--cosmos-2) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vh, 56px);
    padding: 40px 16px 80px;
    position: relative;
  }

  /* Faint twinkling stars in the sky */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 100%),
      radial-gradient(1px 1px at 78% 22%, #fff 50%, transparent 100%),
      radial-gradient(1.2px 1.2px at 30% 8%, #fff 50%, transparent 100%),
      radial-gradient(1px 1px at 60% 14%, #fff 50%, transparent 100%),
      radial-gradient(1px 1px at 88% 35%, #fff 50%, transparent 100%),
      radial-gradient(1px 1px at 8% 70%, #fff 50%, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 78%, #fff 50%, transparent 100%),
      radial-gradient(1px 1px at 22% 86%, #fff 50%, transparent 100%);
    opacity: .55;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .55; }
    50%      { opacity: .25; }
  }

  /* ── Welcome — centered in viewport, Megan-style stacked typography ── */
  .welcome {
    text-align: center;
    z-index: 5;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 620px;
    padding: 0 24px;
  }
  .welcome-eyebrow {
    font-family: var(--font-mono);
    font-size: clamp(10px, 0.9vw, 13px);
    font-weight: 400;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }
  /* Press Start 2P is much chunkier — sizes scaled way down */
  .welcome h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(20px, 3.5vw, 40px);
    line-height: 1.2;
    color: var(--ink-inverted);
    letter-spacing: 0.02em;
    /* pixel-stepped drop shadow (no smooth blur, just hard offsets) */
    text-shadow:
      3px 3px 0 #00000080,
      6px 6px 0 #ffaa50aa;
  }
  .welcome h1 em {
    font-style: normal;
    color: #ffd877;
  }
  .welcome-tagline {
    font-family: var(--font-mono);
    font-size: clamp(13px, 1.3vw, 17px);
    color: var(--ink-mute);
    text-transform: none;
    letter-spacing: 0.04em;
    line-height: 1.5;
    max-width: 500px;
    margin-top: 14px;
  }
  .welcome-tagline .accent { color: #ffd877; }

  /* ── Cart container — rolls in from the left, then settles ── */
  /* New cart SVG is a square (1254x1254 pixel art) so the stage is now 1:1. */
  .cart-stage {
    position: relative;
    width: min(62vw, 540px);
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
    z-index: 10;
    transform: translateX(-130vw);
    animation: rollIn 2.4s cubic-bezier(.18, .8, .35, 1) 0.3s forwards;
    /* Warm glow radiating from the cart */
    filter: drop-shadow(0 0 40px rgba(255, 196, 100, 0.3))
            drop-shadow(0 0 90px rgba(255, 170, 70, 0.16));
  }
  @media (max-width: 720px) {
    .cart-stage { width: min(94vw, 560px); }
  }
  @keyframes rollIn {
    0%   { transform: translateX(-130vw) rotate(-1deg); }
    70%  { transform: translateX(20px) rotate(0.5deg); }    /* rolls slightly past center */
    85%  { transform: translateX(-10px) rotate(-0.3deg); }   /* tiny rebound */
    100% { transform: translateX(0) rotate(0deg); }
  }

  /* Two cart images stacked: rolling (wheels in motion) + stopped (settled).
     Both fill the stage box via object-fit: cover. The rolling image is
     slightly taller than the stopped one — rather than cropping its awning
     off the top, we crop the dust off the bottom by anchoring near the top. */
  .cart-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;     /* show the whole pixel art, no cropping */
    object-position: center;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    transition: opacity 0.35s ease;
    /* No pixelation filter — the new SVG is already pixel art */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .cart-img--rolling {
    opacity: 1;
    object-position: center 25%;  /* anchor near the top so awning isn't clipped */
  }
  .cart-img--stopped {
    opacity: 0;
    object-position: center bottom;
  }
  .cart-stage.arrived .cart-img--rolling { opacity: 0; }
  .cart-stage.arrived .cart-img--stopped { opacity: 1; }

  /* ── Speech bubble: "click a drink ↓" ──
     Sits just above the menu sign on the side of the cart, with its tail
     pointing down at the menu. Only appears once the cart has rolled in. */
  /* Pixel-styled bubble — sharp corners, stepped drop shadow */
  .menu-prompt {
    position: absolute;
    top: 4%;            /* sits just above the menu in the top-right */
    left: 76%;
    transform: translateX(-50%);
    padding: 8px 12px 9px;
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 0;            /* sharp pixel corners */
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    /* stepped pixel drop shadow */
    box-shadow: 4px 4px 0 var(--ink);
    white-space: nowrap;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
    transition: opacity 0.5s ease 0.5s;
    image-rendering: pixelated;
  }
  /* tail pointing down toward the menu list below */
  .menu-prompt::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    margin-left: -6px;
    width: 12px;
    height: 12px;
    background: var(--cream);
    border-right: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  .cart-stage.arrived .menu-prompt {
    opacity: 1;
    animation: promptBob 3s ease-in-out 1.2s infinite;
  }
  @keyframes promptBob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-4px); }
  }

  /* tiny dust cloud trailing behind while the cart rolls in */
  .dust-trail {
    position: absolute;
    bottom: 4%;
    left: -8%;
    width: 22%;
    height: 18%;
    pointer-events: none;
    opacity: 0;
    z-index: 0;
  }
  .cart-stage:not(.arrived) .dust-trail {
    opacity: 1;
    animation: dustFade 2.4s ease-out 0.3s forwards;
  }
  @keyframes dustFade {
    0%   { opacity: 0.85; }
    80%  { opacity: 0.5; }
    100% { opacity: 0; }
  }
  .dust {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 70%);
    animation: dustPuff 1s ease-out infinite;
  }
  .dust:nth-child(1) { left: 10%; bottom: 30%; animation-delay: 0s;    }
  .dust:nth-child(2) { left: 35%; bottom: 50%; animation-delay: 0.25s; }
  .dust:nth-child(3) { left: 60%; bottom: 20%; animation-delay: 0.5s;  }
  .dust:nth-child(4) { left: 80%; bottom: 60%; animation-delay: 0.75s; }
  @keyframes dustPuff {
    0%   { transform: translateX(0)    scale(0.5); opacity: 0; }
    25%  { opacity: 0.85; }
    100% { transform: translateX(-30px) scale(1.6); opacity: 0; }
  }

  /* Cart bounces while the frog "cooks" your drink */
  .cart-stage.cooking { animation: cookingBounce .4s ease-in-out 3; }
  @keyframes cookingBounce {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20%      { transform: translate(-3px, -2px) rotate(-1.2deg); }
    40%      { transform: translate(3px, -3px) rotate(1deg); }
    60%      { transform: translate(-2px, -1px) rotate(-0.8deg); }
    80%      { transform: translate(2px, -2px) rotate(0.6deg); }
  }

  /* ── Cooking effects: steam puffs and sparkles above the cart ── */
  .cooking-fx {
    position: absolute;
    top: 22%;          /* above the awning, where steam would drift */
    left: 50%;
    width: 38%;
    height: 22%;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 5;
  }
  .puff,
  .spark {
    position: absolute;
    opacity: 0;
    filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
  }
  .puff { font-size: 26px; bottom: 0; }
  .puff:nth-child(1) { left: 22%; }
  .puff:nth-child(2) { left: 48%; }
  .puff:nth-child(3) { left: 72%; }
  .spark { font-size: 20px; filter: drop-shadow(0 0 6px rgba(255, 220, 110, 0.85)); }
  .spark:nth-child(4) { top: 8%;  left: 8%;  }
  .spark:nth-child(5) { top: 28%; right: 8%; }
  .spark:nth-child(6) { bottom: 18%; left: 86%; }

  .cooking-fx[data-active] .puff {
    animation: puffRise 1.1s ease-out infinite;
  }
  .cooking-fx[data-active] .puff:nth-child(1) { animation-delay: 0s;   }
  .cooking-fx[data-active] .puff:nth-child(2) { animation-delay: 0.25s; }
  .cooking-fx[data-active] .puff:nth-child(3) { animation-delay: 0.55s; }
  @keyframes puffRise {
    0%   { transform: translateY(15px) scale(0.4); opacity: 0; }
    25%  { opacity: 0.85; }
    100% { transform: translateY(-70px) scale(1.5); opacity: 0; }
  }

  .cooking-fx[data-active] .spark {
    animation: sparkTwinkle 0.9s ease-in-out infinite;
  }
  .cooking-fx[data-active] .spark:nth-child(4) { animation-delay: 0.1s; }
  .cooking-fx[data-active] .spark:nth-child(5) { animation-delay: 0.45s; }
  .cooking-fx[data-active] .spark:nth-child(6) { animation-delay: 0.7s; }
  @keyframes sparkTwinkle {
    0%, 100% { transform: scale(0.4) rotate(0deg);   opacity: 0; }
    50%      { transform: scale(1.15) rotate(180deg); opacity: 1; }
  }

  /* ── Cup placed on the counter next to the frog (real PNG) ── */
  .counter-cup {
    position: absolute;
    top: 53%;          /* roughly the counter / window sill level */
    left: 56%;         /* just to the right of the frog */
    width: 13%;
    height: auto;
    transform: translate(-50%, 0) scale(0);
    transform-origin: bottom center;
    opacity: 0;
    pointer-events: none;
    z-index: 11;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
  }
  .counter-cup[data-active] {
    animation: cupArrive 0.65s cubic-bezier(.34, 1.56, .64, 1) forwards,
               cupSettle 1.6s ease-in-out 0.65s 1 forwards;
  }
  @keyframes cupArrive {
    0%   { transform: translate(-50%, 30px) scale(0.3) rotate(-8deg); opacity: 0; }
    60%  { transform: translate(-50%, -8px) scale(1.05) rotate(2deg); opacity: 1; }
    100% { transform: translate(-50%, 0)    scale(1)    rotate(0deg); opacity: 1; }
  }
  @keyframes cupSettle {
    0%, 100% { transform: translate(-50%, 0) scale(1); }
    50%      { transform: translate(-50%, -2px) scale(1.01); }
  }

  /* ── Drink rises from the cart and is "handed off" to the viewer ── */
  .drink-handoff {
    position: absolute;
    top: 50%;          /* roughly cart's window where frog is */
    left: 50%;
    font-size: 64px;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 12;
    opacity: 0;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45));
  }
  .drink-handoff[data-active] {
    animation: drinkHandoff 1.4s cubic-bezier(.34, 1.56, .64, 1) forwards;
  }
  @keyframes drinkHandoff {
    0%   { transform: translate(-50%, -30%)  scale(0)   rotate(-15deg); opacity: 0; }
    20%  { transform: translate(-50%, -120%) scale(1.2) rotate(8deg);   opacity: 1; }   /* pop up */
    45%  { transform: translate(-50%, -160%) scale(1.1) rotate(-3deg);  opacity: 1; }   /* hover */
    65%  { transform: translate(-50%, -160%) scale(1.4) rotate(0deg);   opacity: 1; }   /* present */
    100% { transform: translate(-50%, -130%) scale(2.4) rotate(0deg);   opacity: 0; }   /* hand off */
  }

  /* String-light bulbs were positioned for the painted cart — pixel cart has
     its own baked-in lights, so the overlay is hidden. */
  .bulbs {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .bulb {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ffe18b;
    box-shadow:
      0 0 6px 1.5px rgba(255, 225, 139, 0.95),
      0 0 16px 4px rgba(255, 200, 110, 0.7),
      0 0 36px 10px rgba(255, 180, 80, 0.32);
    transform: translate(-50%, -50%);
    animation: flicker 2.4s ease-in-out infinite;
  }
  .bulb:nth-child(1) { left: 35%; top: 19%; animation-delay: 0s;   }
  .bulb:nth-child(2) { left: 43%; top: 17%; animation-delay: .35s; }
  .bulb:nth-child(3) { left: 51%; top: 19%; animation-delay: .7s;  }
  .bulb:nth-child(4) { left: 59%; top: 17%; animation-delay: 1.1s; }
  .bulb:nth-child(5) { left: 67%; top: 19%; animation-delay: 1.5s; }
  .bulb:nth-child(6) { left: 74%; top: 17%; animation-delay: 1.9s; }

  @keyframes flicker {
    0%, 100% { opacity: 1;    transform: translate(-50%, -50%) scale(1);    }
    45%      { opacity: .85;  transform: translate(-50%, -50%) scale(0.94); }
    55%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.04); }
  }

  /* ── Clickable drink hotspots ──
     Positioned over the three drinks on the menu board.
     Coords are % of the image width/height, tuned to your image. */
  .drink {
    position: absolute;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 8px;
    padding: 0;
    /* hidden until the cart arrives */
    opacity: 0;
    pointer-events: none;
    transition: transform .25s cubic-bezier(.22,1,.36,1), opacity 0.4s ease 0.2s;
    z-index: 2;
  }
  .cart-stage.arrived .drink { opacity: 1; pointer-events: auto; }
  .drink:hover { transform: scale(1.08) translateY(-2px); }
  .drink:active { transform: scale(1.02); }
  .drink:focus { outline: none; }
  .drink:focus-visible { outline: 2px solid var(--green-1); outline-offset: 4px; }

  /* Stacked over the 3-drink menu in the top-right of the pixel cart.
     Each hotspot sits over exactly one drink name on the menu. */
  .drink--matcha   { left: 60%; top: 8%;  width: 36%; height: 7%; }
  .drink--vanilla  { left: 60%; top: 17%; width: 36%; height: 7%; }
  .drink--blacktea { left: 60%; top: 26%; width: 36%; height: 7%; }

  /* Tooltip label that appears under each drink on hover */
  .drink-label {
    position: absolute;
    bottom: -34px;
    left: 50%;
    transform: translate(-50%, -6px);
    background: var(--cream);
    color: var(--ink);
    border-radius: 12px;
    padding: 5px 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .25s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
  .drink:hover .drink-label {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ── Fireflies — small glowing dots drifting around the page ── */
  .firefly {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff5b8;
    box-shadow:
      0 0 5px 1.5px rgba(255, 240, 150, 0.95),
      0 0 12px 3px rgba(255, 215, 110, 0.55),
      0 0 26px 7px rgba(255, 195, 80, 0.25);
    pointer-events: none;
    z-index: 11; /* above cart and text, like real ambient particles */
    will-change: transform, opacity;
  }

  /* blink: each firefly fades in and out independently */
  @keyframes blink {
    0%, 100% { opacity: 0.18; }
    25%      { opacity: 1; }
    55%      { opacity: 0.35; }
    80%      { opacity: 0.85; }
  }

  /* four drift paths with different shapes/directions */
  @keyframes drift-a {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(70px, -45px); }
    50%  { transform: translate(140px, 15px); }
    75%  { transform: translate(50px, 70px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes drift-b {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(-80px, -30px); }
    45%  { transform: translate(-130px, 50px); }
    70%  { transform: translate(-40px, 90px); }
    90%  { transform: translate(30px, 30px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes drift-c {
    0%   { transform: translate(0, 0); }
    18%  { transform: translate(45px, -85px); }
    40%  { transform: translate(-25px, -120px); }
    65%  { transform: translate(-90px, -50px); }
    85%  { transform: translate(-30px, 30px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes drift-d {
    0%   { transform: translate(0, 0); }
    30%  { transform: translate(-60px, 40px); }
    60%  { transform: translate(20px, 90px); }
    85%  { transform: translate(80px, 20px); }
    100% { transform: translate(0, 0); }
  }

  /* 10 fireflies — staggered start positions, paths, durations, and blink offsets */
  .firefly--1  { top: 18%; left: 10%; animation: drift-a 16s ease-in-out -2s  infinite, blink 3.4s ease-in-out -0.5s infinite; }
  .firefly--2  { top: 25%; left: 78%; animation: drift-b 19s ease-in-out -8s  infinite, blink 4.1s ease-in-out -1.2s infinite; }
  .firefly--3  { top: 60%; left: 22%; animation: drift-c 14s ease-in-out -5s  infinite, blink 3.8s ease-in-out -0.8s infinite; }
  .firefly--4  { top: 12%; left: 50%; animation: drift-d 17s ease-in-out -3s  infinite, blink 4.5s ease-in-out -2.1s infinite; }
  .firefly--5  { top: 72%; left: 88%; animation: drift-a 22s ease-in-out -12s infinite, blink 3.2s ease-in-out -0.3s infinite; }
  .firefly--6  { top: 48%; left: 60%; animation: drift-b 15s ease-in-out -7s  infinite, blink 4.8s ease-in-out -2.5s infinite; }
  .firefly--7  { top: 8%;  left: 30%; animation: drift-c 20s ease-in-out -10s infinite, blink 3.6s ease-in-out -1.8s infinite; }
  .firefly--8  { top: 38%; left: 85%; animation: drift-d 18s ease-in-out -6s  infinite, blink 4.2s ease-in-out -0.9s infinite; }
  .firefly--9  { top: 55%; left: 8%;  animation: drift-a 21s ease-in-out -14s infinite, blink 3.9s ease-in-out -3s   infinite; }
  .firefly--10 { top: 80%; left: 38%; animation: drift-b 16s ease-in-out -4s  infinite, blink 4.6s ease-in-out -1.5s infinite; }

  @media (prefers-reduced-motion: reduce) {
    .firefly { animation: blink 4s ease-in-out infinite !important; }
  }

  /* ── "Order being made" overlay — cosmos themed ── */
  .serving {
    position: fixed;
    inset: 0;
    background: rgba(10, 13, 22, 0);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: background-color .5s, opacity .35s;
  }
  .serving[data-active] {
    background: rgba(10, 13, 22, 0.92);
    opacity: 1;
    pointer-events: auto;
  }

  .serving-cup {
    font-size: 88px;
    transform: translateY(20px);
    opacity: 0;
    transition: transform .6s cubic-bezier(.22,1,.36,1), opacity .4s;
  }
  .serving[data-active] .serving-cup {
    transform: translateY(0);
    opacity: 1;
  }

  .serving-text {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(14px, 2vw, 22px);
    color: var(--ink-inverted);
    text-align: center;
    line-height: 1.4;
    text-shadow: 3px 3px 0 #00000080;
    transform: translateY(10px);
    opacity: 0;
    transition: transform .6s cubic-bezier(.22,1,.36,1) .15s, opacity .4s .15s;
  }
  .serving[data-active] .serving-text {
    transform: translateY(0);
    opacity: 1;
  }

  .serving-sub {
    font-family: var(--font-mono);
    font-size: clamp(13px, 1.2vw, 16px);
    color: var(--ink-mute);
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity .4s .9s;
  }
  .serving[data-active] .serving-sub { opacity: 1; }

  /* Steam particles rising from the cup */
  .steam {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.8);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
  }
  .serving[data-active] .steam {
    animation: rise 1.6s ease-out infinite;
  }
  .steam:nth-child(1) { left: calc(50% - 12px); animation-delay: 0s !important; }
  .steam:nth-child(2) { left: calc(50% + 4px); animation-delay: .3s !important; }
  .steam:nth-child(3) { left: calc(50% + 16px); animation-delay: .6s !important; }
  @keyframes rise {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    20%  { opacity: 0.8; }
    100% { transform: translateY(-90px) scale(1.2); opacity: 0; }
  }

  /* Skip link in corner */
  /* "skip intro" — pixel font, stepped border on hover */
  .skip {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-mute);
    text-decoration: none;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border: 2px solid transparent;
    opacity: 0.65;
    transition: opacity .2s, color .2s, border-color .2s;
    z-index: 50;
  }
  .skip:hover {
    opacity: 1;
    color: var(--ink-inverted);
    border-color: var(--ink-inverted);
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .cart-stage.cooking { animation: none; }
    .cooking-fx[data-active] .puff,
    .cooking-fx[data-active] .spark { animation: none; opacity: 1; }
    .steam { animation: none !important; }
  }
</style>
</head>
<body>

  <!-- SVG pixelation filter — chunky 12x12 blocks + posterized palette
       (limits colors to 5 levels per channel for that 16-bit sprite look) -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="pixelate" x="0" y="0" width="100%" height="100%">
        <feFlood x="3" y="3" width="2" height="2"/>
        <feComposite width="14" height="14"/>
        <feTile result="tile"/>
        <feComposite in="SourceGraphic" in2="tile" operator="in"/>
        <feMorphology operator="dilate" radius="7"/>
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
          <feFuncG type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
          <feFuncB type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>

  <!-- Fireflies drifting through the night -->
  <div class="firefly firefly--1" aria-hidden="true"></div>
  <div class="firefly firefly--2" aria-hidden="true"></div>
  <div class="firefly firefly--3" aria-hidden="true"></div>
  <div class="firefly firefly--4" aria-hidden="true"></div>
  <div class="firefly firefly--5" aria-hidden="true"></div>
  <div class="firefly firefly--6" aria-hidden="true"></div>
  <div class="firefly firefly--7" aria-hidden="true"></div>
  <div class="firefly firefly--8" aria-hidden="true"></div>
  <div class="firefly firefly--9" aria-hidden="true"></div>
  <div class="firefly firefly--10" aria-hidden="true"></div>

  <header class="welcome">
    <p class="welcome-eyebrow">Hop on in —</p>
    <h1>Jana <em>Bridi</em></h1>
    <p class="welcome-tagline">
      designer &amp; engineer. <br>
      I <span class="accent">design and build</span> software <br>
      that just feels right. pull up a chair, pick a drink.
    </p>
  </header>

  <div class="cart-stage" id="cart">
    <!-- speech bubble prompting the user to pick a drink -->
    <div class="menu-prompt" aria-live="polite">click a drink ↓</div>

    <!-- dust kicked up while rolling in -->
    <div class="dust-trail" aria-hidden="true">
      <span class="dust"></span>
      <span class="dust"></span>
      <span class="dust"></span>
      <span class="dust"></span>
    </div>

    <!-- pixel-art cart (single image, already pixel-styled). Both classes use
         the same SVG so the rolling/stopped crossfade still works gracefully. -->
    <img class="cart-img cart-img--rolling" src="Downloads/image%2039.svg" alt="" aria-hidden="true">
    <img class="cart-img cart-img--stopped" src="Downloads/image%2039.svg" alt="A pixel-art cafe cart with a frog chef inside, with a drink menu on the side">

    <!-- glowing bulbs sit on top of the painted string lights -->
    <div class="bulbs" aria-hidden="true">
      <span class="bulb"></span>
      <span class="bulb"></span>
      <span class="bulb"></span>
      <span class="bulb"></span>
      <span class="bulb"></span>
      <span class="bulb"></span>
    </div>

    <!-- cooking effects: steam puffs + sparkles while frog "prepares" the drink -->
    <div class="cooking-fx" id="cookingFx" aria-hidden="true">
      <span class="puff">💨</span>
      <span class="puff">💨</span>
      <span class="puff">💨</span>
      <span class="spark">✨</span>
      <span class="spark">✨</span>
      <span class="spark">✨</span>
    </div>

    <!-- the drink the frog hands over after cooking -->
    <div class="drink-handoff" id="drinkHandoff" aria-hidden="true"></div>
    <img class="counter-cup" id="counterCup" src="" alt="" aria-hidden="true">

    <!-- Hotspots over the three menu lines -->
    <button type="button" class="drink drink--matcha" data-drink="Matcha Latte" data-slug="matcha" data-cup="🍵" aria-label="Matcha Latte">
      <span class="drink-label">Matcha Latte</span>
    </button>
    <button type="button" class="drink drink--vanilla" data-drink="Vanilla Latte" data-slug="vanilla" data-cup="☕" aria-label="Vanilla Latte">
      <span class="drink-label">Vanilla Latte</span>
    </button>
    <button type="button" class="drink drink--blacktea" data-drink="Black Tea" data-slug="blacktea" data-cup="🍵" aria-label="Black Tea">
      <span class="drink-label">Black Tea</span>
    </button>
  </div>

  <a href="jana-portfolio.html" class="skip">skip intro</a>

  <!-- Serving overlay -->
  <div class="serving" id="serving" aria-hidden="true">
    <div style="position:relative;">
      <span class="steam"></span>
      <span class="steam"></span>
      <span class="steam"></span>
      <div class="serving-cup" id="cup">☕</div>
    </div>
    <p class="serving-text" id="servingText">One drink, coming right up.</p>
    <p class="serving-sub">stepping into the portfolio…</p>
  </div>

<script>
  const cart         = document.getElementById('cart');
  const overlay      = document.getElementById('serving');
  const cup          = document.getElementById('cup');
  const servingTxt   = document.getElementById('servingText');
  const cookingFx    = document.getElementById('cookingFx');
  const drinkHandoff = document.getElementById('drinkHandoff');
  const counterCup   = document.getElementById('counterCup');

  // when the cart finishes rolling in, swap the rolling image for the stopped one
  // and enable the menu hotspots
  cart.addEventListener('animationend', (e) => {
    if (e.animationName === 'rollIn') {
      cart.classList.add('arrived');
    }
  });

  document.querySelectorAll('.drink').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.drink;
      const icon = btn.dataset.cup;
      const slug = btn.dataset.slug || 'lavender';
      const img  = btn.dataset.img || null;

      // disable all drink buttons so users can't double-order
      document.querySelectorAll('.drink').forEach(b => b.disabled = true);

      // remember the order so the portfolio sidebar can show it
      try { sessionStorage.setItem('janasOrder', slug); } catch (e) {}

      // PHASE A — frog springs into action: cart bounces + steam/sparkles start
      cart.classList.add('cooking');
      cookingFx.dataset.active = '';

      // PHASE B (~1.1s) — drink appears on the counter next to the frog.
      //   - if the drink has a real cup PNG, place it on the counter
      //   - otherwise, fall back to the bigger emoji handoff animation
      setTimeout(() => {
        cart.classList.remove('cooking');
        if (img) {
          counterCup.src = img;
          counterCup.dataset.active = '';
        } else {
          drinkHandoff.textContent = icon;
          drinkHandoff.dataset.active = '';
        }
      }, 1100);

      // PHASE C (~3.0s) — let the cup sit on the counter for ~1s, then fade to cosmos
      setTimeout(() => {
        cookingFx.removeAttribute('data-active');
        cup.textContent = icon;
        servingTxt.textContent = `One ${name} — coming right up.`;
        overlay.dataset.active = '';
        overlay.setAttribute('aria-hidden', 'false');
      }, 3000);

      // PHASE D (~4.0s) — redirect to the portfolio
      setTimeout(() => {
        window.location.href = 'jana-portfolio.html';
      }, 4000);
    });
  });
</script>

</body>
</html>
