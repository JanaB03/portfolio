<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>lilypad · jana bridi</title>
<meta name="description" content="lilypad — Jana Bridi's design portfolio." />
<meta name="theme-color" content="#0a0a0a" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

<style>
  :root {
    --brand-soft: #4cc1d2;
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --ink: #f1f1f1;
    --ink-dim: #9a9a9a;
    --ink-mute: #6a6a6a;
    --rule: #1f1f1f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
    user-select: none;
  }

  /* ─── HEADER ─── */
  header {
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.3px;
  }
  .logo b { color: var(--brand-soft); font-weight: 700; }
  .logo svg { width: 28px; height: 28px; display: block; }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 100px;
    border: 1px solid var(--rule);
    font-size: 13px;
    color: var(--ink-dim);
    transition: color .15s, border-color .15s;
  }
  .switch:hover { color: var(--brand-soft); border-color: var(--brand-soft); }
  .switch .material-symbols-outlined { font-size: 16px; }

  /* ─── GRID ─── */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 40px 80px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px 24px;
  }
  .card {
    display: flex;
    flex-direction: column;
    cursor: pointer;
  }
  .card__media {
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--bg-elev);
    border-radius: 14px;
    overflow: hidden;
    transition: transform .25s;
  }
  .card:hover .card__media { transform: translateY(-4px); }
  .card__media video,
  .card__media iframe {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    border: 0;
  }
  .card__media--contain video { object-fit: contain; background: #000; }
  .card__title {
    margin-top: 14px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .card__meta {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-dim);
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    header { padding: 20px 22px; }
    main { padding: 12px 22px 60px; }
    .grid { grid-template-columns: 1fr; gap: 22px; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#" aria-label="lilypad">
    <svg viewBox="0 0 30 30">
      <defs>
        <radialGradient id="padg" cx="35%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#9ed4a8"/>
          <stop offset="55%" stop-color="#4cc1d2"/>
          <stop offset="100%" stop-color="#168b9d"/>
        </radialGradient>
      </defs>
      <path d="M15 3 a12 12 0 1 1 -0.01 0 L15 15 Z"
            fill="url(#padg)"
            stroke="#0e6473" stroke-width="1" stroke-linejoin="round"/>
      <circle cx="22" cy="10" r="2.6" fill="#ffd1e0" stroke="#bf5a7a" stroke-width="0.9"/>
      <circle cx="22" cy="10" r="0.9" fill="#bf5a7a"/>
    </svg>
    <span><b>lily</b>pad</span>
  </a>

  <a class="switch" href="jana-portfolio-youtube.html">
    <span class="material-symbols-outlined">phone_iphone</span>
    mobile
  </a>
</header>

<main>
  <div class="grid">

    <a href="case-studies/yt/communicare.html" class="card">
      <div class="card__media">
        <video muted loop playsinline preload="metadata" src="OneDrive/communicare%20home%20page%20recording.mp4"></video>
      </div>
      <h3 class="card__title">CommuniCare</h3>
      <p class="card__meta">Field work · Father Joe's Villages · 2025</p>
    </a>

    <a href="case-studies/yt/48in48.html" class="card">
      <div class="card__media" style="background: linear-gradient(135deg, #2D6A4F 0%, #E9C46A 100%);">
        <iframe src="https://ubhealthyproject.org" title="UB Healthy Project — live site" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-same-origin allow-scripts" style="background: #fff;"></iframe>
      </div>
      <h3 class="card__title">UB Healthy Project</h3>
      <p class="card__meta">48in48 · 1st of 50 teams · 2024</p>
    </a>

    <a href="case-studies/yt/pawesome.html" class="card">
      <div class="card__media">
        <video muted loop playsinline preload="metadata" src="OneDrive/pawesome%20recording.mp4"></video>
      </div>
      <h3 class="card__title">Pawesome</h3>
      <p class="card__meta">Side project · end-to-end · 2025</p>
    </a>

    <a href="case-studies/yt/thread.html" class="card">
      <div class="card__media">
        <video muted loop playsinline preload="metadata" src="Downloads/cursorful-video-1778650424561.mp4"></video>
      </div>
      <h3 class="card__title">Thread</h3>
      <p class="card__meta">Full AI build · 2026</p>
    </a>

    <a href="case-studies/yt/phone-mouse.html" class="card">
      <div class="card__media card__media--contain">
        <video class="pm-thumb" muted loop playsinline preload="metadata"
               data-playlist="videos/phone-mouse/01-optical.mp4,videos/phone-mouse/02-cursor-pad-1.mp4,videos/phone-mouse/03-cursor-pad-2.mp4,videos/phone-mouse/04-custom-cursor.mp4"></video>
      </div>
      <h3 class="card__title">Phone-as-Mouse</h3>
      <p class="card__meta">AI-assisted prototype · iOS + Windows · 2026</p>
    </a>

  </div>
</main>

<script>
  // Hover to play, leave to pause
  document.querySelectorAll('.card video').forEach(v => {
    const card = v.closest('.card');
    card.addEventListener('mouseenter', () => v.play().catch(() => {}));
    card.addEventListener('mouseleave', () => v.pause());
  });

  // Phone-as-Mouse thumbnail plays its 4-clip playlist
  document.querySelectorAll('video.pm-thumb').forEach(v => {
    const list = v.dataset.playlist.split(',').map(s => s.trim());
    let i = 0;
    v.src = list[0];
    v.addEventListener('ended', () => {
      i = (i + 1) % list.length;
      v.src = list[i];
      v.play().catch(() => {});
    });
  });
</script>
</body>
</html>
